[package]
name = "genji"
version = "0.1.0"
edition = "2021"
description = "A minimal coding agent"

[[bin]]
name = "genji"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 2

# -- benchmark suites (cargo eval bench SUITE) ------------------------------- #
# `dataset` is a registry dataset pinned to a revision, filtered by `[metadata].category` and
# sampled to a fixed set of `sample` tasks. A suite without `dataset` is the catalog tasks with
# `suite = NAME`.

[benchmarks.capabilities]
description = "cheap capability score: quixbugs, harness-bench-fast, needle-in-log"

[benchmarks.tb-light]
description = "Terminal-Bench 2.1, 3 software-engineering tasks"
dataset = "terminal-bench/terminal-bench-2-1@6"
category = ["software-engineering", "debugging"]
sample = 3

[benchmarks.tb]
description = "Terminal-Bench 2.1, software-engineering and debugging tasks"
dataset = "terminal-bench/terminal-bench-2-1@6"
category = ["software-engineering", "debugging"]

[benchmarks.tb-full]
description = "Terminal-Bench 2.1, all 89 tasks"
dataset = "terminal-bench/terminal-bench-2-1@6"

[benchmarks.swebench]
description = "SWE-bench Verified, 25-task sample"
dataset = "swe-bench/swe-bench-verified@2"
sample = 25

[benchmarks.swebench-full]
description = "SWE-bench Verified, all 500 tasks"
dataset = "swe-bench/swe-bench-verified@2"

# Every task in eval/tasks/ and dataset.toml: its level (smoke, unit, benchmark), the suite of a
# benchmark-level task, capability and difficulty, plus optional genji config overrides
# (`config = { ... }`) merged over the runner's config for that task.
#
#   smoke      does genji work at all
#   unit       one promised feature per task; trivial for a bare-minimum model and quick
#   benchmark  grouped in the [benchmarks] suites below

[tasks."hello-world/hello-world"]
level = "smoke"
capability = "basic"
difficulty = "easy"  # write one file

